# PostgreSQL Database Connection
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/student_db1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Pass123@}

# PostgreSQL Driver
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Flyway owns the schema; Hibernate just verifies the mapping matches.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server Port
server.port=8080

# ---- Nearby Sellers -------------------------------------------------------
# Service radius (km) for the customer dashboard's "Nearby Sellers" list.
# Approved sellers farther than this from the customer's saved location are
# not shown. The client may request a smaller radius per call; this is the
# default applied when it doesn't.
app.nearby.radius-km=25

# ---- Permit Verification uploads ----------------------------------------
# Where permit PDFs land on disk. The default uses the running user's home
# directory so PC restarts and /tmp cleanups never orphan uploaded files;
# the application (and tests) override this through the `UPLOADS_DIR`
# environment variable when running in containers / CI.
app.uploads.dir=${UPLOADS_DIR:${user.home}/gas-delivery-uploads}

# Multipart limits — permit PDFs should be reasonably small (a few MB),
# but the multipart envelope needs headroom for base64/UTF overhead and the
# admin's uploaded licence PDF.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB