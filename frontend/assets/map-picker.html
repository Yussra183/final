<!--
  Map picker — source for the inline OpenStreetMap page used by
  `MapPickerSheet.tsx` and `ShopMapPreview.tsx`.

  Loaded inside a `WebView` (via `react-native-webview`) — no remote
  scripts, no API key, no native module registration. The bridge is:

    RN -> Leaflet
      injectJavaScript(`__setView(${lat}, ${lng}, ${zoom})`) once the
      page is ready. The page exposes `window.__setView` and reads the
      current seed from `window.__SEED__`.

    Leaflet -> RN
      Every drag/click/input handler calls
      `window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'PIN', lat, lng }))`.
      The RN side de-duplicates by lat/lng and re-renders the chip +
      the bottom-bar Confirm button.

  How this file is shipped
  ------------------------
  This HTML is NOT shipped as-is to the WebView, and it is NOT a
  standalone-runnable page — it is a TEMPLATE. At build time,
  `scripts/build-map-picker-inline.js` reads this file along with the
  sibling `leaflet.css` and `leaflet.script`, substitutes them into the
  `{{PICKER_CSS}}` / `{{PICKER_JS}}` placeholders, and emits
  `src/components/mapPickerInline.ts` with the three files as string
  constants. At runtime `mapPickerHtml.ts` assembles them in memory and
  hands the result to `WebView.source.html` with an `https://localhost/`
  baseUrl — no Metro asset registry, no filesystem, no `file://`.

  The placeholders sit on their own lines, NOT inside comments. This is
  load-bearing. Wrapping `{{PICKER_JS}}` in a `//` comment swallows only
  the first line of Leaflet's multi-line banner and lets the rest escape
  as raw garbage, which is a syntax error that kills the whole script
  block — the map then never boots, on every device, online or off.
  Wrapping `{{PICKER_CSS}}` in a block comment breaks at the first of
  the 30 comment-close sequences inside leaflet.css. The generator has
  an automated guard against both; don't reintroduce them.

  Run after editing this file or anything under `assets/map-picker/`:
      node scripts/build-map-picker-inline.js --write

  Tile layer is OSM (`tile.openstreetmap.org`). Free for dev and very
  low-volume demos — see the project plan for the production migration
  path (MapTiler / Stadia / self-hosted).
-->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <title>Map picker</title>
  <style>
/* The generator replaces the bare token below with the whole of
   leaflet.css. It MUST NOT be wrapped in a CSS comment: leaflet.css
   contains 30 occurrences of the comment-close sequence, the first of
   which would terminate the wrapper early and leak the remainder into
   the stylesheet as garbage. Keep it on its own line, uncommented. */
{{PICKER_CSS}}

    html,
    body,
    #map {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      background: #f1f5f9;
      font-family:
        -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    .skeleton {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #64748b;
      font-size: 13px;
      background: #f1f5f9;
      z-index: 998;
    }

    .hidden {
      display: none !important;
    }

    /* Pin marker used for the draggable pin. */
    .pin-marker {
      width: 28px;
      height: 36px;
      background: #0f766e;
      border: 2px solid #fff;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.35);
    }

    .leaflet-control-attribution {
      font-size: 10px;
      opacity: 0.7;
    }

    .readonly .leaflet-control-attribution {
      display: none;
    }
  </style>
</head>

<body>
  <div id="skeleton" class="skeleton">Loading map…</div>
  <div id="map" class="hidden"></div>

  <script>
    // ---- Out-of-band error probe -----------------------------------
    // This block MUST stay in its own <script> tag, above the one
    // holding the Leaflet placeholder. It is the only code that still
    // runs when the main page script fails to parse.
    //
    // Rationale: a syntax error anywhere in an inline <script> kills the
    // ENTIRE block — boot(), postReady(), the "Leaflet failed to load"
    // reporter, all of it. That is exactly the failure this file used to
    // have, and from RN it was indistinguishable from a hang: no READY
    // ever arrived and the sheet fell back to a 3.5s timeout with a
    // generic message. `window.onerror` fires for parse errors in OTHER
    // script blocks, so registering it in its own <script> tag first
    // means a future regression reports itself with file/line/stack
    // instead of silently timing out.
    (function () {
      function report(payload) {
        try {
          if (window.ReactNativeWebView && window.ReactNativeWebView.postMessage) {
            window.ReactNativeWebView.postMessage(JSON.stringify(payload));
          }
        } catch (e) {
          /* bridge not up yet — nothing more we can do from here */
        }
      }
      window.addEventListener("error", function (e) {
        report({
          type: "ERROR",
          code: "SCRIPT_ERROR",
          message: (e && e.message) || "Unknown script error",
          lineno: e && e.lineno,
        });
      });
      window.addEventListener("unhandledrejection", function (e) {
        report({
          type: "ERROR",
          code: "SCRIPT_ERROR",
          message: "Unhandled rejection: " + ((e && e.reason && e.reason.message) || e.reason),
        });
      });
    })();
  </script>

  <script>
/* The generator replaces the bare token below with the whole of
   leaflet.script. It MUST NOT be wrapped in a `//` line comment:
   Leaflet opens with a multi-line banner comment, so a leading `//`
   would comment out only its first line and let the rest escape as raw
   garbage — a syntax error that kills this entire script block. Keep it
   on its own line, uncommented. */
{{PICKER_JS}}

    "use strict";

    // ---- Bridge helpers ---------------------------------------------
    // Emit the current pin back to RN. Rounded to 6 dp (~11 cm) so
    // the RN-side de-dup is stable across re-emits of the same drag.
    function postPin(lat, lng) {
      if (
        typeof lat !== "number" ||
        typeof lng !== "number" ||
        !isFinite(lat) ||
        !isFinite(lng)
      ) {
        return;
      }
      if (!window.ReactNativeWebView || !window.ReactNativeWebView.postMessage) return;
      try {
        window.ReactNativeWebView.postMessage(
          JSON.stringify({
            type: "PIN",
            lat: Math.round(lat * 1e6) / 1e6,
            lng: Math.round(lng * 1e6) / 1e6,
          }),
        );
      } catch (err) {
        // RN bridge unavailable (preview / test mode) — silent.
      }
    }

    function postReady() {
      if (!window.ReactNativeWebView || !window.ReactNativeWebView.postMessage) {
        setTimeout(postReady, 100);
        return;
      }
      try {
        window.ReactNativeWebView.postMessage(
          JSON.stringify({ type: "READY" }),
        );
      } catch (err) {
        setTimeout(postReady, 100);
      }
    }

    // ---- Inbound seed ------------------------------------------------
    // RN calls this via `injectJavaScript` once the WebView is ready.
    window.__setView = function (lat, lng, zoom) {
      if (
        typeof lat !== "number" ||
        typeof lng !== "number" ||
        !isFinite(lat) ||
        !isFinite(lng)
      ) {
        return;
      }
      var z = zoom && isFinite(zoom) ? zoom : 14;
      window.__SEED__ = { lat: lat, lng: lng, zoom: z };
      if (window.__MAP__) {
        window.__MAP__.setView([lat, lng], z);
      }
      if (window.__PIN__) {
        window.__PIN__.setLatLng([lat, lng]);
      } else if (window.__MAP__) {
        window.__PIN__ = L.marker([lat, lng], {
          draggable: true,
          icon: L.divIcon({
            className: "",
            html: '<div class="pin-marker"></div>',
            iconSize: [28, 36],
            iconAnchor: [14, 36],
          }),
        }).addTo(window.__MAP__);
        window.__PIN__.on("dragend", function (e) {
          var ll = e.target.getLatLng();
          postPin(ll.lat, ll.lng);
        });
      }
    };

    // Toggle read-only mode (used by the inline profile preview).
    window.__setReadOnly = function (readOnly) {
      window.__READ_ONLY__ = !!readOnly;
      if (window.__MAP__) {
        if (window.__READ_ONLY__) {
          window.__MAP__.dragging.disable();
          window.__MAP__.scrollWheelZoom.disable();
          window.__MAP__.doubleClickZoom.disable();
          window.__MAP__.touchZoom.disable();
          window.__MAP__.boxZoom.disable();
          window.__MAP__.keyboard.disable();
          document.body.classList.add("readonly");
        } else {
          window.__MAP__.dragging.enable();
          window.__MAP__.scrollWheelZoom.enable();
          window.__MAP__.doubleClickZoom.enable();
          window.__MAP__.touchZoom.enable();
          window.__MAP__.boxZoom.enable();
          window.__MAP__.keyboard.enable();
          document.body.classList.remove("readonly");
        }
      }
    };

    // ---- Multi-pin viewer (NearbyMap) -------------------------------
    // Additive layer on the same page as the single-pin picker. The
    // single-pin layer above continues to emit `PIN` and the
    // multi-pin layer emits `MARKER_TAP` — same page, two contracts.
    // Both can coexist: MapPickerSheet / ShopMapPreview never call
    // `__setMarkers`, so the layer stays empty for them.
    function postMarkerTap(id) {
      if (typeof id !== "string" || id.length === 0) return;
      if (!window.ReactNativeWebView || !window.ReactNativeWebView.postMessage) return;
      try {
        window.ReactNativeWebView.postMessage(
          JSON.stringify({ type: "MARKER_TAP", id: id }),
        );
      } catch (err) {
        /* bridge unavailable — silent */
      }
    }

    function escapeHtml(s) {
      if (typeof s !== "string") return "";
      return s
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    // Replace the current marker layer with the supplied list of
    // markers. Each marker is `{ id, lat, lng, label? }`. Tap on a
    // marker posts MARKER_TAP to RN. Always keeps at least one map
    // view (centred or fit-bounded) so the caller doesn't need to
    // separately call __setView.
    window.__setMarkers = function (json) {
      if (!window.__MAP__) {
        // Page hasn't booted yet — store the payload and replay
        // from boot() (mirrors the single-pin __SEED__ pattern).
        try {
          window.__MARKERS__ = typeof json === "string" ? JSON.parse(json) : { markers: [] };
        } catch (err) {
          window.__MARKERS__ = { markers: [] };
        }
        return;
      }
      var parsed;
      try {
        parsed = typeof json === "string" ? JSON.parse(json) : json;
      } catch (err) {
        return;
      }
      var list = (parsed && parsed.markers) || [];
      // Drop any prior layer.
      if (window.__MARKER_LAYER__) {
        window.__MAP__.removeLayer(window.__MARKER_LAYER__);
        window.__MARKER_LAYER__ = null;
      }
      if (!list.length) {
        return;
      }
      var layer = L.layerGroup();
      var bounds = [];
      for (var i = 0; i < list.length; i++) {
        (function (m) {
          var lat = m.lat;
          var lng = m.lng;
          if (typeof lat !== "number" || !isFinite(lat)) return;
          if (typeof lng !== "number" || !isFinite(lng)) return;
          bounds.push([lat, lng]);
          var html = m.label
            ? '<div class="nm-pin"><span class="nm-pin-label">' + escapeHtml(m.label) + "</span></div>"
            : '<div class="nm-pin"></div>';
          var marker = L.marker([lat, lng], {
            icon: L.divIcon({
              className: "",
              html: html,
              iconSize: [28, 36],
              iconAnchor: [14, 36],
            }),
            // Stash id on options so __selectMarker can find it later
            // without a parallel registry.
            mkId: m.id,
          });
          marker.on("click", function () {
            postMarkerTap(m.id);
          });
          layer.addLayer(marker);
        })(list[i]);
      }
      layer.addTo(window.__MAP__);
      window.__MARKER_LAYER__ = layer;
      if (bounds.length > 1) {
        window.__MAP__.fitBounds(bounds, { padding: [40, 40], maxZoom: 14 });
      } else if (bounds.length === 1) {
        window.__MAP__.setView(bounds[0], 14);
      }
    };

    // Toggle the selected styling on a marker. Cheaper than re-emitting
    // the whole layer when only the selectedId changes.
    window.__selectMarker = function (id) {
      if (!window.__MARKER_LAYER__) return;
      window.__MARKER_LAYER__.eachLayer(function (mk) {
        var el = mk.getElement && mk.getElement();
        if (!el) return;
        var inner = el.querySelector(".nm-pin");
        if (!inner) return;
        if (mk.options.mkId === id) {
          inner.classList.add("nm-pin-selected");
        } else {
          inner.classList.remove("nm-pin-selected");
        }
      });
    };

    // ---- Bootstrapping ----------------------------------------------
    function boot() {
      if (typeof L === "undefined") {
        // Leaflet failed to load; surface to RN for diagnostics.
        try {
          window.ReactNativeWebView.postMessage(
            JSON.stringify({
              type: "ERROR",
              message: "Leaflet failed to load",
            }),
          );
        } catch (e) {
          // silent
        }
        return;
      }

      var seed = window.__SEED__ || { lat: -6.7924, lng: 39.2083, zoom: 14 };

      var map = L.map("map", {
        center: [seed.lat, seed.lng],
        zoom: seed.zoom,
        zoomControl: true,
        attributionControl: true,
      });
      window.__MAP__ = map;

      var tiles = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution:
          '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
      }).addTo(map);

      // Tiles are the ONLY part of this page that needs the network —
      // Leaflet itself is bundled. Report the first failure so RN can
      // say "tiles unavailable, check your connection" instead of
      // implying the map itself is broken. Latched: a viewport pulls
      // dozens of tiles and a dead connection would otherwise fire this
      // on every one of them.
      var tileErrorReported = false;
      tiles.on("tileerror", function () {
        if (tileErrorReported) return;
        tileErrorReported = true;
        if (!window.ReactNativeWebView || !window.ReactNativeWebView.postMessage) return;
        try {
          window.ReactNativeWebView.postMessage(
            JSON.stringify({
              type: "ERROR",
              code: "TILE_ERROR",
              message: "Map tiles unavailable",
            }),
          );
        } catch (err) {
          /* silent */
        }
      });

      // Draggable pin — initialised without coordinates so we don't
      // drop a marker at (0, 0) before the seed arrives.
      var pin = L.marker([seed.lat, seed.lng], {
        draggable: true,
        icon: L.divIcon({
          className: "",
          html: '<div class="pin-marker"></div>',
          iconSize: [28, 36],
          iconAnchor: [14, 36],
        }),
      }).addTo(map);
      window.__PIN__ = pin;

      pin.on("dragend", function (e) {
        var ll = e.target.getLatLng();
        postPin(ll.lat, ll.lng);
      });

      map.on("click", function (e) {
        // In read-only mode (preview), taps don't drop a pin.
        if (window.__READ_ONLY__) return;
        pin.setLatLng(e.latlng);
        postPin(e.latlng.lat, e.latlng.lng);
      });

      // Hide the skeleton, show the map.
      var sk = document.getElementById("skeleton");
      if (sk) sk.classList.add("hidden");
      var mp = document.getElementById("map");
      if (mp) mp.classList.remove("hidden");

      // If the seed arrived before Leaflet loaded, replay it now.
      if (window.__SEED__) {
        map.setView([window.__SEED__.lat, window.__SEED__.lng], window.__SEED__.zoom);
        pin.setLatLng([window.__SEED__.lat, window.__SEED__.lng]);
      }

      // Apply read-only state if RN requested it before boot.
      if (window.__READ_ONLY__) {
        window.__setReadOnly(true);
      }

      // Replay any multi-pin payload that arrived before the map
      // booted (same pattern as __SEED__ above).
      if (window.__MARKERS__) {
        try {
          window.__setMarkers(JSON.stringify(window.__MARKERS__));
        } catch (err) {
          /* ignore */
        }
        window.__MARKERS__ = null;
      }

      // Signal ready. Do NOT auto-emit a PIN postReady — the RN side
      // uses the absence of a user-driven PIN to detect "seller
      // hasn't picked yet, keep Confirm disabled". The boot seed is
      // only visible as a marker on the map; it doesn't get saved
      // until the user taps or drags.
      postReady();
    }

    if (document.readyState === "complete") {
      boot();
    } else {
      window.addEventListener("load", boot);
    }
  </script>
</body>

</html>
